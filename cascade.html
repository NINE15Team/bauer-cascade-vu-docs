<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>

        <style>
            /* --- VU docs: match the guide's own background so nothing flashes --- */
            .staticrypt-html, .staticrypt-body {
                background: #ffffff !important;
                font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-html, .staticrypt-body { background: #131512 !important; }
            }
            html[data-vu-theme="light"], html[data-vu-theme="light"] .staticrypt-body { background: #ffffff !important; }
            html[data-vu-theme="dark"],  html[data-vu-theme="dark"]  .staticrypt-body { background: #131512 !important; }

            /* the full-viewport wrapper carries staticrypt's default green — drop it */
            .staticrypt-content { background: transparent !important; }
            .staticrypt-password-container { background: #ffffff !important; border-radius: 8px; }
            @media (prefers-color-scheme: dark) {
                .staticrypt-password-container { background: #20221e !important; }
            }
            html[data-vu-theme="light"] .staticrypt-password-container { background: #ffffff !important; }
            html[data-vu-theme="dark"]  .staticrypt-password-container { background: #20221e !important; }

            /* no spinner: a remembered decrypt should paint nothing at all */
            .staticrypt-spinner, .staticrypt-spinner-container { display: none !important; }

            /* login card, only seen on first visit */
            .staticrypt-form {
                background: #ffffff !important;
                border: 1px solid #d0d5d2;
                border-radius: 10px;
                box-shadow: 0 1px 2px rgba(26,26,26,.05), 0 8px 24px -16px rgba(26,26,26,.28) !important;
                padding: 36px 32px !important;

            .staticrypt-title { font-weight: 700; font-size: 1.1rem; color: #212121; }

            .staticrypt-hr { border-top-color: #d0d5d2 !important; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                border: 1px solid #d0d5d2 !important; border-radius: 8px !important; background: #ffffff !important;
            }
            .staticrypt-form button {
                background: #90bd3e !important; color: #16240a !important;
                border-radius: 8px !important; font-weight: 700 !important; letter-spacing: .02em;
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-form { background: #1b1d19 !important; border-color: #3a3d36; }
                .staticrypt-title { color: #e9ebe5; }
                .staticrypt-instructions p, .staticrypt-label { color: #a6ab9e; }
                .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                    background: #20221e !important; border-color: #3a3d36 !important; color: #e9ebe5 !important;
                }
                .staticrypt-hr { border-top-color: #3a3d36 !important; }
            }
            html[data-vu-theme="dark"] .staticrypt-form { background: #1b1d19 !important; border-color: #3a3d36; }
            html[data-vu-theme="dark"] .staticrypt-title { color: #e9ebe5; }
            html[data-vu-theme="dark"] .staticrypt-instructions p { color: #a6ab9e; }
            html[data-vu-theme="dark"] .staticrypt-form input { background: #20221e !important; border-color: #3a3d36 !important; color: #e9ebe5 !important; }
        </style>
        <script>
            /* carry the guide's saved light/dark choice into the interstitial */
